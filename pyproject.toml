[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baf-fraud-risk-scoring"
version = "1.0.0"
description = "Time-aware bank-account fraud classification and investigation-at-capacity evaluation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Ilia Jakhaia"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7"
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "ipykernel>=6", "kagglehub>=0.3"]
dev = ["pytest>=8", "ruff>=0.7"]

[project.scripts]
baf-fraud = "baf_fraud.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["notebooks", "results/generated"]
