<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-label="Class imbalance | BAF Base"><rect width="1120" height="500" rx="20" fill="#f6f8fc"/><rect x="32" y="32" width="1056" height="436" rx="20" fill="white" stroke="#e3eaf3"/><text x="70" y="90" fill="#14284d" font-size="29" font-weight="700" font-family="Arial,sans-serif">Class imbalance | BAF Base</text><text x="70" y="124" fill="#667895" font-size="16" font-family="Arial,sans-serif">1,000,000 synthetic bank account applications</text><rect x="75" y="215" width="970" height="54" rx="11" fill="#e7edf5"/><rect x="75" y="215" width="959.3" height="54" rx="11" fill="#3f70d2"/><rect x="1034.3" y="215" width="10.7" height="54" rx="2" fill="#ea8a4c"/><text x="75" y="187" fill="#3f70d2" font-family="Arial,sans-serif" font-size="21" font-weight="700">988,971 legitimate applications (98.90%)</text><text x="75" y="327" fill="#ea8a4c" font-family="Arial,sans-serif" font-size="21" font-weight="700">11,029 fraud applications (1.10%)</text><text x="75" y="397" fill="#667895" font-family="Arial,sans-serif" font-size="17" >Why this matters: accuracy alone is misleading when almost 99% of cases are legitimate.</text></svg>