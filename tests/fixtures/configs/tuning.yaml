seed: 0
domains:
- ibm
- elliptic2
models:
- LogReg
- RandomForest
- GradBoosting
- ExtraTrees
bootstrap_resamples: 25
platt_c: 1.0
grids:
  LogReg:
    c_values:
    - 0.1
    - 1.0
    max_iter: 500
  RandomForest:
    candidates:
    - n_estimators: 20
      max_depth: 6
      min_samples_leaf: 1
      max_features: sqrt
  GradBoosting:
    candidates:
    - learning_rate: 0.1
      max_iter: 25
      max_leaf_nodes: 7
      min_samples_leaf: 2
      l2_regularization: 0.0
  ExtraTrees:
    candidates:
    - n_estimators: 20
      max_depth: 6
      min_samples_leaf: 1
      max_features: sqrt
