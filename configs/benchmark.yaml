seeds: [0, 1, 2]
test_size: 0.30
validation_fraction: 0.20
max_nodes_restricted: 10
size_cols: ["n_nodes", "n_edges"]

models:
  SizeOnly:
    feature_set: "size"
    max_iter: 2000
    class_weight: "balanced"
  LogReg:
    feature_set: "all"
    max_iter: 2000
    class_weight: "balanced"
  RandomForest:
    feature_set: "all"
    n_estimators: 400
    min_samples_leaf: 2
    class_weight: "balanced_subsample"
  GradBoosting:
    feature_set: "all"
    max_iter: 300
    learning_rate: 0.05
    class_weight: "balanced"
